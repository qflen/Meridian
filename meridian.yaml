server:
  http_addr: "0.0.0.0:8080"
  grpc_addr: "0.0.0.0:9090"

storage:
  data_dir: "./data"
  wal_dir: "./data/wal"
  # Head flushes to a Gorilla-compressed block every block_duration. Short values
  # surface the compression ratio quickly; 2h–24h is typical for production.
  block_duration: "15m"
  retention: "15d"
  flush_interval: "30s"
  # Coalesce concurrently-submitted WAL frames into a single fsync (ADR-026).
  # Durability is unchanged — a write still returns only after its frame is fsynced —
  # but concurrent writers share one fsync, raising ingest throughput. Set false for
  # the legacy one-fsync-per-frame path.
  wal_group_commit: true
  # Optional Nagle-style delay before each batch fsync, to coalesce more frames per
  # fsync at the cost of latency. "0" adds no latency and still coalesces in-flight
  # arrivals. Try "1ms"–"5ms" only if fsync is a hard bottleneck under bursty load.
  wal_commit_linger: "0s"

cluster:
  enabled: false
  node_id: ""
  bind_addr: "0.0.0.0:7946"
  join: []
  replication_factor: 3
  virtual_nodes: 256

downsampling:
  # Automatic rollup cascade (ADR-011). On each pass, raw blocks are rolled up to
  # the 1m tier and the 1m tier is chained (count-weighted) into the 1h tier, each
  # stored resolution-tagged. The query planner picks a resolution from the query
  # span/step, so a wide view reads coarse rollup points instead of raw. Each tier
  # has its own retention; coarser tiers are kept longer and all exceed the raw
  # retention (15d) above, so a long-range query survives raw expiry.
  enabled: true
  interval: "1m"   # how often a downsampling pass runs
  rules:
    - source_interval: "5s"
      target_interval: "1m"
      retention: "30d"
    - source_interval: "1m"
      target_interval: "1h"
      retention: "365d"

ingestion:
  batch_size: 1000
  flush_interval: "100ms"
  max_concurrent_writes: 64
  # Write-path backpressure (ADR-023). The ingest queue holds at most
  # queue_capacity samples — the hard memory cap. A full queue blocks the
  # producer up to block_deadline (backpressure); past it, the batch is shed
  # (dropped + counted, producer NACKed) instead of buffered without bound.
  # queue_high_watermark is the depth at which producers are flagged to throttle.
  queue_capacity: 50000
  queue_high_watermark: 40000
  block_deadline: "250ms"

anomaly:
  # Streaming per-series anomaly detection over the live telemetry path (ADR-024).
  # Each series tracks an EWMA baseline + dispersion; a point is flagged when its
  # local z-score |value-baseline|/dispersion exceeds threshold. The moving
  # baseline tracks slow diurnal swings and drift (no alert) while a spike departs
  # sharply from it (alert). Robustness knobs (Huber clamp, scale floor,
  # hysteresis) take internal defaults.
  enabled: true
  threshold: 3.5    # local z-score above which a sample is out-of-band (~3–4)
  alpha: 0.1        # EWMA smoothing in (0,1]; smaller = steadier baseline
  warmup: 20        # samples used to seed a baseline before any alert may fire
  debounce_k: 2     # consecutive out-of-band samples required to raise an alert

log:
  level: "info"
  format: "text"
